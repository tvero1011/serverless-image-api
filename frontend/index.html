<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AWS Portfolio - Image Upload</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; background: #f4f7f6; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #232f3e; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #ccc; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Cloud Image Uploader</h2>
    <input type="file" id="fileInput" accept="image/*" />
    <button id="uploadBtn">Upload to AWS</button>
    <div id="status"></div>
</div>

<script>
    const API_URL = "https://7jlibxlkej.execute-api.us-east-1.amazonaws.com/prod/upload";
    const uploadBtn = document.getElementById("uploadBtn");
    const statusDiv = document.getElementById("status");

    uploadBtn.onclick = async () => {
        const file = document.getElementById("fileInput").files[0];
        if (!file) return alert("Please select a file first!");

        // UI Feedback
        uploadBtn.disabled = true;
        statusDiv.innerText = "Uploading to S3...";
        statusDiv.style.color = "blue";

        const reader = new FileReader();
        reader.readAsDataURL(file);

        reader.onload = async () => {
            // Get the base64 string and strip the prefix (data:image/png;base64,)
            const base64 = reader.result.split(',')[1]; 

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        image: base64,       // Matches Lambda 'body.image'
                        fileName: file.name, // Matches Lambda 'body.fileName'
                        contentType: file.type 
                    })
                });

                const json = await res.json();

                if (res.ok) {
                    statusDiv.innerText = "✅ Success! Image saved in S3.";
                    statusDiv.style.color = "green";
                    console.log("Response:", json);
                } else {
                    throw new Error(json.error || "Server error");
                }
            } catch (err) {
                console.error("Upload Error:", err);
                statusDiv.innerText = "❌ Upload failed: " + err.message;
                statusDiv.style.color = "red";
            } finally {
                uploadBtn.disabled = false;
            }
        };
    };
</script>
</body>
</html>
